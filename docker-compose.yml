
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Aviyal_Eats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: aviyal_eats-backend:latest
    build: ./backend
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db

  email_worker:
    image: aviyal_eats-backend:latest
    pull_policy: never
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
      PYTHONUNBUFFERED: "1"
    command:
      - sh
      - -c
      - |
        while true; do
          python manage.py process_email_queue
          sleep 15
        done
    restart: unless-stopped
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
